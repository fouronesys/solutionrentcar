build:
  name: Preview Android APK
  steps:
    - eas/checkout

    - run:
        name: Install, prebuild y build APK
        command: |
          set -e
          echo "== Directorio actual =="
          pwd
          ls -la
          if [ ! -f package.json ]; then
            echo "package.json no está aquí; buscando..."
            cd "$(dirname "$(find . -maxdepth 2 -name package.json -not -path '*/node_modules/*' | head -1)")"
            pwd
          fi
          echo "== Instalando dependencias con yarn =="
          rm -f package-lock.json
          yarn install --network-timeout 300000 || npm install --legacy-peer-deps --no-audit --no-fund
          test -x ./node_modules/.bin/expo || { echo "ERROR: expo no quedó instalado"; exit 1; }
          echo "== Prebuild Android =="
          ./node_modules/.bin/expo prebuild --no-install --platform android
          echo "== Gradle assembleDebug =="
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

    - eas/find_and_upload_build_artifacts
