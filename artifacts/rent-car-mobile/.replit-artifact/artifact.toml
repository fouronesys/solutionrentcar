kind = "mobile"
previewPath = "/"
title = "Solution Rent Car"
version = "1.0.0"
id = "artifacts/rent-car-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21047

[services.development]
run = "pnpm --filter @workspace/rent-car-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rent-car-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/rent-car-mobile", "run", "serve" ]

[services.env]
PORT = "21047"
BASE_PATH = "/"
