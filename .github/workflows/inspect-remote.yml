name: Inspect remote FTP (temporal)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run: inspect | diag-hosts | fetch-lkrentacar | patch-lkrentacar | deploy-central | build-index | run-update | cleanup'
        required: true
        default: 'inspect'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp || { sudo apt-get update -qq && sudo apt-get install -y lftp; }

      - name: Run action
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.RENTCAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.RENTCAR_FTP_PASSWORD }}
          ADMIN_KEY: ${{ secrets.RENTCAR_ADMIN_KEY }}
          LKRENTACAR_DB_PASSWORD: ${{ secrets.LKRENTACAR_DB_PASSWORD }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          run_lftp() {
            lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; $1; bye" 2>&1 || true
          }

          mkdir -p out

          if [ "$ACTION" = "diag-hosts" ]; then
            # Upload the diagnostic from the repo, run it via HTTP, then delete it
            run_lftp "put scripts/rtdiag.php -o /RENTCAR/rtdiag.php"
            echo "Uploaded rtdiag.php"
            sleep 3
            curl -s -m 300 "https://assanpos.com/RENTCAR/rtdiag.php?order=rev&host=socket" > out/diag_result_rev.txt || true
            cat out/diag_result_rev.txt
            run_lftp "rm /RENTCAR/rtdiag.php"
            echo "Deleted rtdiag.php"

          elif [ "$ACTION" = "fetch-lkrentacar" ]; then
            # Strict FTP download — no || true so failures propagate
            lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
              "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; get /RENTCAR/LK-RENTACAR/core/controller/Database.php -o /tmp/lkrentacar_db.php; bye" \
              2>&1 && echo "FTP get OK" || { echo "FTP get FAILED"; exit 1; }
            [ -s /tmp/lkrentacar_db.php ] || { echo "Downloaded file is empty"; exit 1; }
            echo "=== LK-RENTACAR Database.php (non-credential lines) ==="
            grep -E '\$this->(host|user|ddbb)\s*=' /tmp/lkrentacar_db.php || true
            # Show masked password and length (both quote styles)
            python3 << 'PYEOF'
import re, sys
content = open('/tmp/lkrentacar_db.php').read()
m = re.search(r"""\$this->pass\s*=\s*(['"])(.*?)\1""", content)
if not m:
    print("WARNING: no $this->pass assignment found", file=sys.stderr)
    sys.exit(1)
q, pw = m.group(1), m.group(2)
print(f"quote style: {q!r}")
print(f"password length: {len(pw)}")
print(f"$this->pass = {q}{'*' * len(pw)}{q};")
PYEOF

          elif [ "$ACTION" = "patch-lkrentacar" ]; then
            # Patch the Database.php password for LK-RENTACAR using LKRENTACAR_DB_PASSWORD secret
            if [ -z "$LKRENTACAR_DB_PASSWORD" ]; then echo "ERROR: LKRENTACAR_DB_PASSWORD secret is not set in GitHub"; exit 1; fi
            # Strict FTP download
            lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
              "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; get /RENTCAR/LK-RENTACAR/core/controller/Database.php -o /tmp/lkrentacar_db.php; bye" \
              2>&1 && echo "FTP get OK" || { echo "FTP get FAILED"; exit 1; }
            [ -s /tmp/lkrentacar_db.php ] || { echo "Downloaded file is empty"; exit 1; }
            echo "Patching password..."
            python3 << 'PYEOF'
import re, os, sys
content = open('/tmp/lkrentacar_db.php').read()
new_pass = os.environ['LKRENTACAR_DB_PASSWORD']

# PHP-escape for a single-quoted string literal: escape \ and '
php_escaped = new_pass.replace('\\', '\\\\').replace("'", "\\'")

# Match $this->pass = '...' or $this->pass = "..." (both quote styles)
pattern = r"""(\$this->pass\s*=\s*)(['"])[^'"]*\2"""
replacement = r"\g<1>'" + php_escaped + "'"

patched, count = re.subn(pattern, replacement, content)
if count == 0:
    print("ERROR: no \\$this->pass assignment found in Database.php", file=sys.stderr)
    sys.exit(1)
if count > 1:
    print(f"ERROR: {count} \\$this->pass assignments found (expected exactly 1)", file=sys.stderr)
    sys.exit(1)
open('/tmp/lkrentacar_db.php', 'w').write(patched)
print(f"Patched 1 assignment → single-quoted form, escaped length {len(php_escaped)}")
PYEOF
            # PHP syntax check on the patched file
            php -l /tmp/lkrentacar_db.php || { echo "PHP syntax error in patched file — aborting upload"; exit 1; }
            local_size=$(stat -c%s /tmp/lkrentacar_db.php)
            echo "Uploading patched file (${local_size} bytes)..."
            # Strict FTP upload
            lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
              "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; put /tmp/lkrentacar_db.php -o /RENTCAR/LK-RENTACAR/core/controller/Database.php; bye" \
              2>&1 && echo "FTP put OK" || { echo "FTP put FAILED"; exit 1; }
            # Verify upload size
            remote_size=$(lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
              "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 30; cls -la /RENTCAR/LK-RENTACAR/core/controller/Database.php; bye" \
              2>/dev/null | awk '{print $5}' | head -1 || echo "unknown")
            echo "local_size=${local_size} remote_size=${remote_size}"
            [ "$remote_size" = "$local_size" ] || { echo "SIZE MISMATCH after upload (remote=${remote_size} local=${local_size}) — re-run to retry"; exit 1; }
            # Verify connectivity via rtdiag
            run_lftp "put scripts/rtdiag.php -o /RENTCAR/rtdiag.php"
            sleep 3
            curl -s -m 60 "https://assanpos.com/RENTCAR/rtdiag.php?host=socket" \
              | grep -i "lk-rentacar\|LK-RENTACAR" > out/lkrentacar_diag.txt || true
            cat out/lkrentacar_diag.txt
            run_lftp "rm /RENTCAR/rtdiag.php"
            if grep -qi "SOCKET:OK" out/lkrentacar_diag.txt; then
              echo "✅ LK-RENTACAR now connects OK"
            else
              echo "❌ LK-RENTACAR still failing — check credentials or hPanel MySQL user"
              exit 1
            fi

          elif [ "$ACTION" = "deploy-central" ]; then
            # Sube los scripts centrales refactorizados (lotes + índice de usuarios)
            if [ -z "$ADMIN_KEY" ]; then echo "RENTCAR_ADMIN_KEY secret missing"; exit 1; fi
            # En el servidor solo se guarda el hash SHA-256 de la clave (inútil si se filtra)
            printf '%s' "$ADMIN_KEY" | sha256sum | cut -d' ' -f1 > /tmp/central_admin_key.hash
            deploy_out=$(run_lftp "put scripts/central/rtcommon.php -o /RENTCAR/rtcommon.php; put scripts/central/login.php -o /RENTCAR/login.php; put scripts/central/update.php -o /RENTCAR/update.php; put scripts/central/indexer.php -o /RENTCAR/indexer.php; mkdir -p /RENTCAR/logs; put /tmp/central_admin_key.hash -o /RENTCAR/logs/central_admin_key.hash")
            rm -f /tmp/central_admin_key.hash
            # Retirar la clave en texto plano de despliegues anteriores (si existe)
            run_lftp "rm /RENTCAR/logs/central_admin_key.txt" >/dev/null || true
            echo "$deploy_out"
            if echo "$deploy_out" | grep -qi "error"; then echo "DEPLOY FAILED (FTP error)"; exit 1; fi
            # Verificar tamaños de lo subido contra lo local
            run_lftp "cls -la /RENTCAR/rtcommon.php /RENTCAR/login.php /RENTCAR/update.php /RENTCAR/indexer.php /RENTCAR/logs/central_admin_key.hash" > out/central-php-listing.txt
            cat out/central-php-listing.txt
            for f in rtcommon login update indexer; do
              local_size=$(stat -c%s scripts/central/$f.php)
              grep -q " $local_size .*$f\.php" out/central-php-listing.txt || { echo "VERIFY FAILED: $f.php size mismatch"; exit 1; }
            done
            # Los endpoints admin deben fallar cerrado sin clave
            code_upd=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://assanpos.com/RENTCAR/update.php")
            code_idx=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://assanpos.com/RENTCAR/indexer.php")
            echo "no-key http codes: update=$code_upd indexer=$code_idx" | tee out/central-authcheck.txt
            [ "$code_upd" = "403" ] && [ "$code_idx" = "403" ] || { echo "AUTH CHECK FAILED"; exit 1; }
            # Selftest de la ruta índice→conexión→consulta de login (muestra de 10)
            curl -s -m 120 -H "X-Admin-Key: ${ADMIN_KEY}" "https://assanpos.com/RENTCAR/indexer.php?selftest=10" > out/central-selftest.txt || true
            cat out/central-selftest.txt
            grep -q "SELFTEST_FAIL=0" out/central-selftest.txt || { echo "SELFTEST FAILED"; exit 1; }
            run_lftp "cls -la /RENTCAR/*.php" > out/central-php-listing.txt || true
            cat out/central-php-listing.txt

          elif [ "$ACTION" = "build-index" ]; then
            # Ejecuta indexer.php repetidamente hasta indexar todas las instalaciones
            : > out/index_build.txt
            for i in $(seq 1 30); do
              echo "== round $i ==" | tee -a out/index_build.txt
              curl -s -m 120 -H "X-Admin-Key: ${ADMIN_KEY}" "https://assanpos.com/RENTCAR/indexer.php" | tee -a out/index_build.txt
              if grep -q "PENDIENTES=0" out/index_build.txt; then echo "INDEX COMPLETE"; break; fi
              sleep 10
            done

          elif [ "$ACTION" = "run-update" ]; then
            # Ejecuta update.php por lotes hasta procesar todas las bases
            : > out/update_run.txt
            for i in $(seq 1 30); do
              echo "== round $i ==" | tee -a out/update_run.txt
              curl -s -m 240 -H "X-Admin-Key: ${ADMIN_KEY}" "https://assanpos.com/RENTCAR/update.php" | tee -a out/update_run.txt
              if grep -q "PENDIENTES=0" out/update_run.txt; then echo "UPDATE COMPLETE"; break; fi
              sleep 10
            done

          elif [ "$ACTION" = "cleanup" ]; then
            run_lftp "rm /RENTCAR/rtdiag.php" || true
            run_lftp "rm /RENTCAR/rtfix.php" || true
            echo "Cleaned up"

          else
            # Default: inspect
            run_lftp "cls -la /RENTCAR/" > out/rentcar-listing.txt
            cat out/rentcar-listing.txt
          fi

      - name: Publish results
        if: always()
        run: |
          [ -d out ] || exit 0
          git config user.name "inspect-bot"
          git config user.email "inspect@localhost"
          git checkout --orphan inspect-output || git checkout inspect-output
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/keep && cp -r out /tmp/keep/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/keep/out .
          git add out
          git commit -m "inspect/fix output"
          git push -f origin inspect-output
