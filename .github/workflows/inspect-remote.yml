name: Inspect remote FTP (temporal)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        timeout-minutes: 5
        run: |
          sudo apt-get install -y lftp || { sudo apt-get update -qq && sudo apt-get install -y lftp; }

      - name: Inspect RENTCAR root and sibling installs
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.RENTCAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.RENTCAR_FTP_PASSWORD }}
        run: |
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          mkdir -p out
          run_lftp() {
            lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; $1; bye" 2>&1 || true
          }
          B=/RENTCAR
          run_lftp "cls -la $B/" > out/root-listing.txt
          cat out/root-listing.txt
          # Central login files of the RENTCAR multi-tenant login
          for f in index.php default.php login.php socket.php core/autoload.php core/controller/Lb.php core/controller/Database.php; do
            run_lftp "get $B/$f -o out/central_$(echo $f | tr '/' '_')" || true
          done
          run_lftp "cls -laR $B/core/" > out/central-core-listing.txt || true
          # Each rentcar installation: grab Database.php (redacted later)
          dirs=$(awk '/\/$/{print $NF}' out/root-listing.txt | awk -F/ '{print $(NF-1)}' | grep -Ev '^\.|^core$|^css$|^img$|^lib$' || true)
          echo "DIRS: $dirs"
          for d in $dirs; do
            run_lftp "get $B/$d/core/controller/Database.php -o out/db_${d}.php" || true
          done
          # Redact any password-looking assignments before publishing
          for f in out/*.php out/*.txt; do
            [ -f "$f" ] && sed -i -E "s/(pass[a-zA-Z_]*['\"]?\s*(=|=>)\s*)['\"][^'\"]*['\"]/\1'REDACTED'/gI" "$f"
          done
          ls -la out/

      - name: Publish results to branch
        run: |
          git config user.name "inspect-bot"
          git config user.email "inspect@localhost"
          git checkout --orphan inspect-output
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/keep && cp -r out /tmp/keep/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/keep/out .
          git add out
          git commit -m "inspect output"
          git push -f origin inspect-output
