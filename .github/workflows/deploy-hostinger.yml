name: Deploy to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: FTP sync to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Generar db.local.php (BD propia de la instancia)
        if: ${{ secrets.DB_NAME != '' }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cat > core/db.local.php <<EOF
          <?php
          return [
            'host' => '${DB_HOST}',
            'user' => '${DB_USER}',
            'pass' => '${DB_PASSWORD}',
            'ddbb' => '${DB_NAME}',
            'port' => 3306,
          ];
          EOF

      - name: Mirror to Hostinger via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" <<'LFTP_EOF'
            set ssl:verify-certificate no
            set ftp:ssl-allow no
            set net:max-retries 3
            set net:timeout 20
            set xfer:clobber on
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob mobile/ \
              --exclude-glob .local/ \
              --exclude-glob .replit \
              --exclude-glob replit.nix \
              --exclude-glob replit.md \
              --exclude-glob '*.md' \
              --exclude-glob start.sh \
              --exclude-glob .gitignore \
              --exclude-glob .gitattributes \
              --exclude-glob .editorconfig \
              --exclude-glob tests/ \
              --exclude-glob test/ \
              --exclude-glob home/ \
              --exclude-glob CF-SYSTEMS/storage/ \
              --exclude-glob firmas/ \
              --exclude-glob backups/ \
              ./ /
            bye
          LFTP_EOF
