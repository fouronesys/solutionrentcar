name: Deploy to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: FTP sync to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        timeout-minutes: 5
        run: |
          sudo apt-get install -y lftp || { sudo apt-get update -qq && sudo apt-get install -y lftp; }

      - name: Generar db.local.php (BD propia de la instancia)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_NAME" ]; then echo "Sin secrets de BD, se omite"; exit 0; fi
          cat > core/db.local.php <<EOF
          <?php
          return [
            'host' => '${DB_HOST}',
            'user' => '${DB_USER}',
            'pass' => '${DB_PASSWORD}',
            'ddbb' => '${DB_NAME}',
            'port' => 3306,
          ];
          EOF

      - name: Inyectar credenciales de la instancia en Database.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_NAME" ]; then echo "Sin secrets de BD, se omite"; exit 0; fi
          F=core/controller/Database.php
          php -r '
            $f = $argv[1];
            $c = file_get_contents($f);
            $map = [
              "host" => getenv("DB_HOST"),
              "user" => getenv("DB_USER"),
              "pass" => getenv("DB_PASSWORD"),
              "ddbb" => getenv("DB_NAME"),
            ];
            foreach ($map as $k => $v) {
              $c = preg_replace(
                "/(\\\$this->{$k}\s*=\s*)\"[^\"]*\"/",
                "\$1\"" . addslashes($v) . "\"",
                $c, 1, $n
              );
              if ($n !== 1) { fwrite(STDERR, "No se pudo inyectar {$k}\n"); exit(1); }
            }
            file_put_contents($f, $c);
          ' "$F"
          grep -c "srv500.hstgr.io" "$F" || echo "host reemplazado"

      - name: Mirror to Hostinger via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" <<'LFTP_EOF'
            set ssl:verify-certificate no
            set ftp:ssl-allow no
            set net:max-retries 3
            set net:timeout 20
            set xfer:clobber on
            rm -rf /.aider.input.history /.aider.tags.cache.v4 /.DS_Store /.agents /.continue || echo "cleanup done"
            rm -f /IMG_4620.jpg /IMG_4621.jpg /IMG_4622.jpg /IMG_4623.jpg || true
            rm -rf /store-assets /store-screenshots /docs /attached_assets || true
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob .git* \
              --exclude-glob '.aider*' \
              --exclude-glob .agents/ \
              --exclude-glob .continue/ \
              --exclude-glob .DS_Store \
              --exclude-glob .easignore \
              --exclude-glob attached_assets/ \
              --exclude-glob store-assets/ \
              --exclude-glob store-screenshots/ \
              --exclude-glob docs/ \
              --exclude-glob 'IMG_*.jpg' \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob mobile/ \
              --exclude-glob .local/ \
              --exclude-glob .replit \
              --exclude-glob replit.nix \
              --exclude-glob replit.md \
              --exclude-glob '*.md' \
              --exclude-glob start.sh \
              --exclude-glob .gitignore \
              --exclude-glob .gitattributes \
              --exclude-glob .editorconfig \
              --exclude-glob tests/ \
              --exclude-glob test/ \
              --exclude-glob home/ \
              --exclude-glob CF-SYSTEMS/storage/ \
              --exclude-glob deploy_assets/ \
              --exclude-glob firmas/ \
              --exclude-glob backups/ \
              ./ /
            mirror --reverse --verbose --parallel=4 \
              ./deploy_assets/car_images/ /CF-SYSTEMS/storage/invoice_files/
            bye
          LFTP_EOF

      - name: Aplicar fallback dual-host en RENTCAR/login.php y update.php
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.RENTCAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.RENTCAR_FTP_PASSWORD }}
        run: |
          set +x
          if [ -z "$FTP_USER" ]; then echo "Sin RENTCAR_FTP_USER, se omite"; exit 0; fi
          export LFTP_PASSWORD="$FTP_PASSWORD"
          cat > /tmp/rtfix.php << 'PHPEOF'
<?php
$root = $_SERVER['DOCUMENT_ROOT'];
$files = [
  $root.'/RENTCAR/update.php' => [
    'search' => "        \$pdo = new PDO(\n            \"mysql:host={\$info['host']};dbname={\$info['db']};charset=utf8mb4\",\n            \$info['user'],\n            \$info['pass'],\n            [\n                PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION\n            ]\n        );",
    'replace' => "        // RENTCAR_HOST_PATCH v2: dual-host fallback\n        \$_rh=(\$info['host']===\"localhost\"||\$info['host']===\"127.0.0.1\")? [\"127.0.0.1\",\"195.35.61.45\"] :[\$info['host']];\n        \$pdo=null;\$_re=null;foreach(\$_rh as \$_rhi){try{\$pdo=new PDO(\"mysql:host={\$_rhi};dbname={\$info['db']};charset=utf8mb4\",\$info['user'],\$info['pass'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);break;}catch(PDOException \$e){\$_re=\$e;if(strpos(\$e->getMessage(),\"2002\")===false)throw \$e;}}if(\$pdo===null)throw \$_re;",
  ],
  $root.'/RENTCAR/login.php' => [
    'search' => "        \$dsn = \"mysql:host=\" . \$db['host'] .\n               \";dbname=\" . \$db['dbname'] .\n               \";charset=utf8\";\n\n        \$pdo = new PDO(\n            \$dsn,\n            \$db['user'],\n            \$db['password'],\n            array(\n                PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,\n                PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC\n            )\n        );",
    'replace' => "        // RENTCAR_HOST_PATCH v2: dual-host fallback\n        \$_lh=(\$db['host']===\"localhost\"||\$db['host']===\"127.0.0.1\")? [\"127.0.0.1\",\"195.35.61.45\"] :[\$db['host']];\n        \$pdo=null;\$_le=null;foreach(\$_lh as \$_lhi){try{\$pdo=new PDO(\"mysql:host={\$_lhi};dbname={\$db['dbname']};charset=utf8\",\$db['user'],\$db['password'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);break;}catch(PDOException \$e){\$_le=\$e;if(strpos(\$e->getMessage(),\"2002\")===false)throw \$e;}}if(\$pdo===null)throw \$_le;",
  ],
];
$out=[];
foreach($files as $path=>$op){
  if(!file_exists($path)){$out[]="NOT_FOUND:$path";continue;}
  $txt=file_get_contents($path);
  $txt=preg_replace('/[ \t]*\/\/ RENTCAR_HOST_PATCH[^\n]*\n/','',$txt);
  $txt=preg_replace('/[ \t]*if\s*\(\$db_host\s*===\s*[\'"][^\n]+\n/','',$txt);
  $txt=preg_replace('/[ \t]*if\s*\(\$db\[.host.\]\s*===\s*[\'"]localhost[^\n]+\n/','',$txt);
  if(strpos($txt,$op['search'])!==false){
    $txt=str_replace($op['search'],$op['replace'],$txt);
    file_put_contents($path,$txt);
    $out[]="OK:$path";
  } else {
    $out[]="SEARCH_NOT_FOUND:$path";
    foreach(explode("\n",$txt) as $i=>$l){
      if(strpos($l,'new PDO')!==false||strpos($l,'RENTCAR_HOST')!==false)
        $out[]=" L".($i+1).":".trim($l);
    }
  }
}
echo implode("\n",$out)."\n";
PHPEOF
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; put /tmp/rtfix.php -o /RENTCAR/rtfix.php; bye" 2>&1 | grep -v "^lftp"
          sleep 3
          curl -s -m 30 "https://assanpos.com/RENTCAR/rtfix.php" || true
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "set ssl:verify-certificate no; set ftp:ssl-allow no; rm /RENTCAR/rtfix.php; bye" 2>&1 | grep -v "^lftp" || true
          echo "Fix step done"
