name: Mobile · Android build (APK)

on:
  push:
    branches: [master, main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (preview = APK, production = AAB)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build — Android
        id: eas
        env:
          # If your build needs runtime keys, expose them here from GitHub
          # secrets and reference them in mobile/.env or app.json extras.
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          # `eas build --json --wait` blocks until the build finishes and
          # then emits a JSON array containing exactly the build(s) just
          # produced by *this* invocation. We capture stdout and parse it,
          # which avoids the race condition of `eas build:list` picking up
          # an unrelated concurrent build.
          set -euo pipefail
          eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.value }} \
            --non-interactive \
            --json \
            --wait > build.json
          BUILD_ID=$(node -e "const b=require('./build.json'); process.stdout.write(b[0]?.id||'')")
          URL=$(node -e "const b=require('./build.json'); process.stdout.write(b[0]?.artifacts?.buildUrl||'')")
          PROFILE="${{ steps.profile.outputs.value }}"
          # APK for preview, AAB for production. Inferred from profile so
          # the extension never depends on parsing a signed URL.
          if [ "$PROFILE" = "production" ]; then EXT=aab; else EXT=apk; fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL"           >> "$GITHUB_OUTPUT"
          echo "ext=$EXT"           >> "$GITHUB_OUTPUT"

      - name: Download Android artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          URL='${{ steps.eas.outputs.url }}'
          EXT='${{ steps.eas.outputs.ext }}'
          BID='${{ steps.eas.outputs.build_id }}'
          if [ -z "$URL" ]; then
            echo "::error::EAS build $BID did not return an artifact URL"
            exit 1
          fi
          echo "Downloading build $BID -> $URL"
          curl -fL "$URL" -o "artifacts/solutions-rent-car-android-${{ steps.profile.outputs.value }}.$EXT"
          ls -lh artifacts

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.profile.outputs.value }}
          path: mobile/artifacts/*
          if-no-files-found: error
          retention-days: 14
