name: Inspect GRUAS login (temporary)

on:
  push:
    branches: [inspect-gruas]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp || { sudo apt-get update -qq && sudo apt-get install -y lftp; }

      - name: Download sanitized GRUAS login files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          mkdir -p inspect
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
            "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 2; set net:timeout 20; get /GRUAS/login.php -o inspect/login.php; get /GRUAS/index.php -o inspect/index.php; get /GRUAS/DEMO/core/controller/Database.php -o inspect/Database.php; get /GRUAS/DEMO/core/app/action/process-action.php -o inspect/process-action.php; bye"
          for file in inspect/*.php; do
            sed -E \
              -e 's/((password|passwd|secret|token|api[_-]?key)[^=]*=[[:space:]]*["'\"'\"'']).*/\1[REDACTED]/Ig' \
              -e 's/((password|passwd|secret|token|api[_-]?key)[^:]*:[[:space:]]*["'\"'\"'']).*/\1[REDACTED]/Ig' \
              "$file" > "$file.safe"
            mv "$file.safe" "$file"
          done

      - name: Upload sanitized inspection
        uses: actions/upload-artifact@v4
        with:
          name: gruas-login-inspection
          path: inspect/
          retention-days: 1