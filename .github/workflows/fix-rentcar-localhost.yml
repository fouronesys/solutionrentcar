name: Fix RENTCAR localhost patch (127.0.0.1)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp || { sudo apt-get update -qq && sudo apt-get install -y lftp; }

      - name: Download current login.php and update.php from server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.RENTCAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.RENTCAR_FTP_PASSWORD }}
        run: |
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          mkdir -p out
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "
            set ssl:verify-certificate no
            set ftp:ssl-allow no
            set net:max-retries 2
            set net:timeout 20
            get /RENTCAR/login.php -o out/login.php
            get /RENTCAR/update.php -o out/update.php
            bye
          "
          echo "=== before patch ==="
          grep -n "195.35\|127.0.0\|localhost\|PATCH" out/login.php out/update.php || true

      - name: Patch 195.35.61.45 → 127.0.0.1
        run: |
          python3 << 'PYEOF'
          for path in ['out/login.php', 'out/update.php']:
              txt = open(path).read()
              orig = txt
              txt = txt.replace("$db['host'] = '195.35.61.45'", "$db['host'] = '127.0.0.1'")
              txt = txt.replace("$db_host = '195.35.61.45'", "$db_host = '127.0.0.1'")
              open(path, 'w').write(txt)
              print(f"{path}: {'CHANGED' if txt != orig else 'UNCHANGED'}")
              for line in txt.splitlines():
                  if any(x in line for x in ['127.0.0.1', '195.35', 'PATCH', 'localhost']):
                      print(f"  {line.strip()}")
          PYEOF

      - name: Upload patched files to server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.RENTCAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.RENTCAR_FTP_PASSWORD }}
        run: |
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "
            set ssl:verify-certificate no
            set ftp:ssl-allow no
            set net:max-retries 2
            set net:timeout 20
            put out/login.php -o /RENTCAR/login.php
            put out/update.php -o /RENTCAR/update.php
            bye
          "
          echo "Upload complete"

      - name: Publish patched files to branch for audit
        run: |
          git config user.name "fix-bot"
          git config user.email "fix@localhost"
          git checkout --orphan fix-output || git checkout fix-output
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/keep && cp -r out /tmp/keep/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/keep/out .
          git add out
          git commit -m "fix output: 195.35.61.45 → 127.0.0.1"
          git push -f origin fix-output
