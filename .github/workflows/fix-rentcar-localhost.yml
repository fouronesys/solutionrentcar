name: Fix RENTCAR localhost patch (dual-host fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp || { sudo apt-get update -qq && sudo apt-get install -y lftp; }

      - name: Download current files from server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.RENTCAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.RENTCAR_FTP_PASSWORD }}
        run: |
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          mkdir -p out
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "
            set ssl:verify-certificate no
            set ftp:ssl-allow no
            set net:max-retries 2
            set net:timeout 20
            get /RENTCAR/login.php -o out/login.php
            get /RENTCAR/update.php -o out/update.php
            bye
          "

      - name: Apply dual-host fallback (precise string replacement)
        run: |
          python3 << 'PYEOF'
          # ---------------------------------------------------------------
          # update.php: replace the new PDO(...) call with a fallback loop
          # ---------------------------------------------------------------
          OLD_UPDATE = '''    try {

        $pdo = new PDO(
            "mysql:host={$info['host']};dbname={$info['db']};charset=utf8mb4",
            $info['user'],
            $info['pass'],
            [
                PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION
            ]
        );'''

          NEW_UPDATE = '''    try {

        // RENTCAR_HOST_PATCH: intenta 127.0.0.1, si da 2002 reintenta con 195.35.61.45
        $_rtry_hosts = ($info['host'] === 'localhost' || $info['host'] === '127.0.0.1')
            ? ['127.0.0.1', '195.35.61.45'] : [$info['host']];
        $pdo = null; $_rtry_last = null;
        foreach ($_rtry_hosts as $_rtry_h) {
            try {
                $pdo = new PDO(
                    "mysql:host={$_rtry_h};dbname={$info['db']};charset=utf8mb4",
                    $info['user'], $info['pass'],
                    [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
                );
                break;
            } catch (PDOException $_rtry_e) {
                $_rtry_last = $_rtry_e;
                if (strpos($_rtry_e->getMessage(), '2002') === false) throw $_rtry_e;
            }
        }
        if ($pdo === null) throw $_rtry_last;'''

          # ---------------------------------------------------------------
          # login.php: replace the DSN + new PDO(...) block with fallback
          # ---------------------------------------------------------------
          OLD_LOGIN = '''        $dsn = "mysql:host=" . $db['host'] .
               ";dbname=" . $db['dbname'] .
               ";charset=utf8";

        $pdo = new PDO(
            $dsn,
            $db['user'],
            $db['password'],
            array(
                PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC
            )
        );'''

          NEW_LOGIN = '''        // RENTCAR_HOST_PATCH: intenta 127.0.0.1, si da 2002 reintenta con 195.35.61.45
        $_rtry_login_hosts = ($db['host'] === 'localhost' || $db['host'] === '127.0.0.1')
            ? ['127.0.0.1', '195.35.61.45'] : [$db['host']];
        $pdo = null; $_rtry_login_last = null;
        foreach ($_rtry_login_hosts as $_rtry_login_h) {
            try {
                $pdo = new PDO(
                    "mysql:host={$_rtry_login_h};dbname={$db['dbname']};charset=utf8",
                    $db['user'], $db['password'],
                    array(PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                          PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC)
                );
                break;
            } catch (PDOException $_rtry_login_e) {
                $_rtry_login_last = $_rtry_login_e;
                if (strpos($_rtry_login_e->getMessage(), '2002') === false) throw $_rtry_login_e;
            }
        }
        if ($pdo === null) throw $_rtry_login_last;'''

          changes = {
              'out/update.php': (OLD_UPDATE, NEW_UPDATE),
              'out/login.php':  (OLD_LOGIN,  NEW_LOGIN),
          }

          for path, (old, new) in changes.items():
              txt = open(path).read()
              # Remove any existing RENTCAR_HOST_PATCH simple lines first
              import re
              txt = re.sub(r'[ \t]*//[ \t]*RENTCAR_HOST_PATCH[^\n]*\n', '', txt)
              txt = re.sub(r'[ \t]*if \(\$db_host === .localhost.[^\n]+RENTCAR_HOST_PATCH[^\n]*\n', '', txt)
              txt = re.sub(r'[ \t]*if \(\$db\[.host.\] === .localhost.[^\n]+\n', '', txt)
              if old in txt:
                  txt = txt.replace(old, new, 1)
                  print(f"{path}: PATCHED (PDO block replaced)")
              else:
                  print(f"{path}: WARNING — old block not found verbatim; dumping context")
                  idx = txt.find('new PDO(')
                  print(repr(txt[max(0,idx-200):idx+400]))
              open(path, 'w').write(txt)
          PYEOF

      - name: Upload patched files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.RENTCAR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.RENTCAR_FTP_PASSWORD }}
        run: |
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "
            set ssl:verify-certificate no
            set ftp:ssl-allow no
            set net:max-retries 2
            set net:timeout 20
            put out/login.php -o /RENTCAR/login.php
            put out/update.php -o /RENTCAR/update.php
            bye
          "
          echo "Upload complete"

      - name: Publish to branch for audit
        run: |
          git config user.name "fix-bot"
          git config user.email "fix@localhost"
          git checkout --orphan fix-output || git checkout fix-output
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/keep && cp -r out /tmp/keep/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/keep/out .
          git add out
          git commit -m "fix output: dual-host fallback preciso"
          git push -f origin fix-output
