name: Mobile · iOS native build (Xcode / macOS)

# Native-Xcode build path on a GitHub-hosted macOS runner. This is the
# alternative to mobile-ios.yml (which uses EAS Build). Pick whichever
# fits your workflow — they produce the same artifact (an .ipa).
#
# This workflow:
#   1. Runs `npx expo prebuild --platform ios` to materialize the ios/
#      project from the managed Expo config.
#   2. Imports the Apple Distribution certificate + provisioning profile
#      from base64-encoded GitHub secrets into a temporary keychain.
#   3. Builds an .xcarchive with xcodebuild.
#   4. Exports an .ipa via `xcodebuild -exportArchive` and uploads it.
#
# Heads-up: macOS minutes on GitHub Actions are billed at 10x ubuntu
# minutes. On Replit's autoscale plan EAS Build is usually cheaper unless
# you already pay for macOS minutes elsewhere.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios-xcode.yml"
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method"
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc        # internal distribution (preview)
          - app-store     # TestFlight / App Store
          - development   # team device testing

concurrency:
  group: mobile-ios-xcode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode archive + export
    runs-on: macos-14   # arm64, Xcode 15.4+
    defaults:
      run:
        working-directory: mobile

    env:
      EXPORT_METHOD: ${{ inputs.export_method || (startsWith(github.ref, 'refs/tags/v') && 'app-store' || 'ad-hoc') }}
      SCHEME: SolutionsRentCar
      WORKSPACE: ios/SolutionsRentCar.xcworkspace
      KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild (generate ios/)
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          # Repo-update is slow but ensures the spec for any new pod is found.
          pod install --repo-update

      - name: Import Apple signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROVISION_PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
        run: |
          set -euo pipefail
          bash scripts/ios-import-signing.sh

      - name: Build archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROVISION_PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SolutionsRentCar.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISION_PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates \
            archive | xcpretty && exit "${PIPESTATUS[0]}"

      - name: Export IPA
        run: |
          set -euo pipefail
          # Write ExportOptions.plist using the chosen export method.
          /usr/libexec/PlistBuddy -c "Clear dict" -c "Add :method string $EXPORT_METHOD" \
            -c "Add :teamID string ${{ secrets.IOS_TEAM_ID }}" \
            -c "Add :signingStyle string manual" \
            -c "Add :stripSwiftSymbols bool true" \
            -c "Add :compileBitcode bool false" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:${{ secrets.IOS_BUNDLE_ID }} string ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}" \
            build/ExportOptions.plist
          xcodebuild \
            -exportArchive \
            -archivePath build/SolutionsRentCar.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export | xcpretty && exit "${PIPESTATUS[0]}"
          ls -lh build/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-${{ env.EXPORT_METHOD }}
          path: mobile/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
