name: Mobile · Android native build (Gradle)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-gradle.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build type"
        required: true
        default: bundleRelease
        type: choice
        options:
          - bundleRelease
          - assembleRelease

concurrency:
  group: mobile-android-gradle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'bundleRelease' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json

      - name: Expo prebuild (generate android/)
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-import-signing.sh

      - name: Gradle assemble / bundle
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_SOLUTIONS_RENT_CAR_UPLOAD_STORE_FILE: ${{ github.workspace }}/mobile/android/app/upload.keystore
          ORG_GRADLE_PROJECT_SOLUTIONS_RENT_CAR_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SOLUTIONS_RENT_CAR_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SOLUTIONS_RENT_CAR_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ${{ env.BUILD_TYPE }} --no-daemon --stacktrace

      - name: Locate artifact
        id: art
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "bundleRelease" ]; then
            FILE=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
            EXT=aab
          else
            FILE=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
            EXT=apk
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "ext=$EXT" >> "$GITHUB_OUTPUT"
          ls -lh "$FILE"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-${{ env.BUILD_TYPE }}
          path: mobile/${{ steps.art.outputs.file }}
          if-no-files-found: error
          retention-days: 14
