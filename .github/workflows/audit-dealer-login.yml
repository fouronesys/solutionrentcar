name: Audit Dealer logins (temporal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp || { sudo apt-get update -qq && sudo apt-get install -y lftp; }

      - name: Inventory Dealer installations
        env:
          FTP_HOST: ${{ secrets.PUBLIC_HTML_FTP_HOST }}
          FTP_USER: ${{ secrets.PUBLIC_HTML_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.PUBLIC_HTML_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p out

          if [ -z "${FTP_HOST}" ] || [ -z "${FTP_USER}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "PUBLIC_HTML FTP secrets are not configured in GitHub."
            exit 1
          fi

          export LFTP_PASSWORD="$FTP_PASSWORD"
          for app in JER-IMPORT2R SEVENFAUTOS; do
            root="/DEALER/${app}"
            echo "=== ${app}: top-level listing ==="
            lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "
              set ssl:verify-certificate no;
              set ftp:ssl-allow no;
              set net:max-retries 3;
              set net:timeout 30;
              cls -la ${root};
              bye
            " | tee "out/${app}-top.txt"

            echo "=== ${app}: recursive inventory (capped for log output) ==="
            lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "
              set ssl:verify-certificate no;
              set ftp:ssl-allow no;
              set net:max-retries 3;
              set net:timeout 30;
              find ${root};
              bye
            " > "out/${app}-inventory.txt"
            sed -n '1,5000p' "out/${app}-inventory.txt"

            echo "=== ${app}: login/config candidates ==="
            grep -Ei '/(login|index|config|database|bootstrap|autoload|common|\\.htaccess)([^/]*)$' \
              "out/${app}-inventory.txt" | head -200 || true
          done