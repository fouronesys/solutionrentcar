name: Upload GRUAS login pilot (temporal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Upload only GRUAS login pilot
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.PUBLIC_HTML_UPLOAD_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.PUBLIC_HTML_UPLOAD_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          system_listing="$(mktemp)"
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
            "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; cls -la /GRUAS; bye" \
            >"$system_listing"
          if grep -Eq '/login-pilot\.php$' "$system_listing"; then
            echo "Remote /GRUAS/login-pilot.php already exists; refusing to overwrite it."
            exit 2
          fi
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
            "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; put scripts/pilot-login.php -o /GRUAS/login-pilot.php; cls -l /GRUAS/login-pilot.php; bye"