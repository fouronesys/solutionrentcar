name: Upload login pilot (temporal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Remove misplaced root pilot
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.PUBLIC_HTML_UPLOAD_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.PUBLIC_HTML_UPLOAD_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          export LFTP_PASSWORD="$FTP_PASSWORD"
          root_listing="$(mktemp)"
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
            "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; cls -la /; bye" \
            >"$root_listing"
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e \
            "set ssl:verify-certificate no; set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; rm /login-pilot.php; bye"