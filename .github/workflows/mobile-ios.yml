name: Mobile · iOS build (IPA via EAS)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build (iOS)
    # EAS Build itself runs on Expo's hosted macOS workers, so we only need
    # a tiny Ubuntu runner to drive the CLI. This keeps the job free of the
    # 10x macOS minutes multiplier on GitHub-hosted runners.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=production" >> "$GITHUB_OUTPUT"
          else
            echo "value=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build — iOS
        id: eas
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          # Apple credentials are managed by EAS (`eas credentials`) — no
          # secrets need to live in CI as long as you ran `eas credentials`
          # once on your machine and let EAS store them on the project.
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # `eas build --json --wait` returns the JSON for *this* build,
          # so we never race other concurrent builds.
          set -euo pipefail
          eas build \
            --platform ios \
            --profile ${{ steps.profile.outputs.value }} \
            --non-interactive \
            --json \
            --wait > build.json
          BUILD_ID=$(node -e "const b=require('./build.json'); process.stdout.write(b[0]?.id||'')")
          URL=$(node -e "const b=require('./build.json'); process.stdout.write(b[0]?.artifacts?.buildUrl||'')")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL"           >> "$GITHUB_OUTPUT"

      - name: Download iOS artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          URL='${{ steps.eas.outputs.url }}'
          BID='${{ steps.eas.outputs.build_id }}'
          if [ -z "$URL" ]; then
            echo "::error::EAS build $BID did not return an artifact URL"
            exit 1
          fi
          echo "Downloading build $BID -> $URL"
          curl -fL "$URL" -o "artifacts/solutions-rent-car-ios-${{ steps.profile.outputs.value }}.ipa"
          ls -lh artifacts

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ steps.profile.outputs.value }}
          path: mobile/artifacts/*
          if-no-files-found: error
          retention-days: 14
